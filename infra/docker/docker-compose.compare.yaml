# Side-by-side demo overlay: keep the NLIP stack (port 3000) and add a second
# Next.js frontend built from a git worktree of `main` (port 3100).
#
# Do not duplicate Keycloak/Postgres/MinIO/Qdrant — two full stacks OOM a
# typical Docker Desktop VM. Both UIs share login, projects, and documents so
# the demo is "same bot, with vs without NLIP".
#
# Started by infra/scripts/start-nlip-compare.sh. Requires:
#   ILLINOIS_CHAT_BASELINE_FRONTEND  path to apps/frontend on the main worktree

services:
  frontend-baseline:
    profiles: [compare]
    build:
      context: ${ILLINOIS_CHAT_BASELINE_FRONTEND}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_KEYCLOAK_REALM: illinois_chat_realm
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: illinois_chat
        NEXT_PUBLIC_USE_ILLINOIS_CHAT_CONFIG: "True"
        NEXT_PUBLIC_KEYCLOAK_URL: "http://localhost:8080/"
        NEXT_PUBLIC_S3_ENDPOINT: "http://localhost:9000"
        NEXT_PUBLIC_ILLINOIS_CHAT_BANNER_CONTENT: "Baseline (main) — no NLIP. NLIP branch is on :3000."
    restart: unless-stopped
    ports:
      - "${BASELINE_FRONTEND_PORT:-3100}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - uiuc-chat-network
    environment:
      RAILWAY_URL: "http://backend:8001"
      INGEST_URL: "http://backend:8001/ingest"
      CRAWLEE_API_URL: "http://crawlee:3000/crawl"
      REDIS_URL: "redis://default:${INGEST_REDIS_PASSWORD}@redis:6379"
      KEYCLOAK_URL: "http://keycloak:8080/"
      POSTGRES_ENDPOINT: postgres-illinois-chat
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-postgres}
      POSTGRES_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSL: "false"
      KEYCLOAK_DB_ENDPOINT: postgres-keycloak
      KEYCLOAK_DB_PORT: 5432
      KEYCLOAK_DB_DATABASE: ${POSTGRES_DATABASE:-postgres}
      KEYCLOAK_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KEYCLOAK_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_SSL: "false"
      LOCAL_MINIO: true
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_KEY: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-uiuc-chat}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-illinois_chat}
      QDRANT_URL: http://qdrant:6333
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      ALLOWED_EMBEDDING_PROVIDERS: ${ALLOWED_EMBEDDING_PROVIDERS:-openai,ollama}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      SIM_API_BASE_URL: ${SIM_API_BASE_URL:-http://simstudio:3000}
      OLLAMA_SERVER_URL: ${OLLAMA_SERVER_URL:-}
      NCSA_HOSTED_VLM_BASE_URL: ${NCSA_HOSTED_VLM_BASE_URL:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-http://host.docker.internal:11434/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      NCSA_HOSTED_API_KEY: ${NCSA_HOSTED_API_KEY:-}
    depends_on:
      keycloak:
        condition: service_healthy
      postgres-illinois-chat:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
